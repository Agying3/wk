name: tdog release verification

# Requires an explicitly configured self-hosted runner on tdog.
# The same script can be used over SSH without configuring a GitHub runner.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, tdog]
    steps:
      - uses: actions/checkout@v4
      - name: Verify and build on the tdog host
        shell: bash
        run: |
          set -euo pipefail
          source /srv/build-server/env/workbuddy2api.sh
          export GOMAXPROCS=4
          python3 scripts/test-package-source.py
          bash scripts/build-release.sh "$RUNNER_TEMP/workbuddy2api-release"
          (cd react && npm test)
          go test -p=2 ./... -count=1 -timeout=10m
          go vet -p=2 ./...
      - uses: actions/upload-artifact@v4
        with:
          name: workbuddy2api-release
          path: ${{ runner.temp }}/workbuddy2api-release/
