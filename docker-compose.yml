services:
  wb2api:
    build:
      context: ${WB2A_RELEASE_DIR:?set WB2A_RELEASE_DIR to the complete tdog release artifact directory}
      dockerfile: Dockerfile.local
    container_name: workbuddy2api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json

networks:
  default:
    external: true
    name: deploy_default
